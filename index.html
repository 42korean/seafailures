<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크레인 고장이력관리 분석기 008 (GitHub 연동형)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .pivot-cell { cursor: pointer; transition: all 0.2s; }
        .pivot-cell:hover { background-color: #dbeafe; transform: scale(1.02); font-weight: bold; }
        .sortable-header { cursor: pointer; user-select: none; }
        .sortable-header:hover { background-color: #e2e8f0; }
        .detail-sortable { cursor: pointer; user-select: none; transition: background-color 0.2s; }
        .detail-sortable:hover { background-color: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- 헤더 -->
        <header class="mb-6 pb-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-blue-700 flex items-center gap-2">
                    🏗️ 크레인 고장이력관리 분석 (GitHub 연동)
                </h1>
                <p class="text-sm text-slate-500 mt-1">
                    BU를 선택하면 GitHub에 등록된 최신 CSV 데이터를 자동으로 불러와 분석합니다.
                </p>
            </div>
            <!-- 업로드 버튼 대신 동기화 상태 배지 표시 -->
            <div id="syncStatus" class="text-xs bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-sm">
                ☁️ 대기 중
            </div>
        </header>

        <!-- 피벗 옵션 설정 패널 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 pb-6 border-b border-slate-100">
                
                <!-- 1. BU 선택 드롭다운 (제일 위 배치) -->
                <div>
                    <h2 class="text-base font-bold text-slate-700 mb-4 flex items-center gap-2">🛠️ 1. BU (사업장) 선택</h2>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">조회할 터미널 BU를 선택하세요</label>
                    <select id="buSelect" onchange="loadCSVByBU()" class="w-full bg-blue-50 border border-blue-300 text-blue-900 rounded-lg p-3 text-sm font-bold shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors cursor-pointer">
                        <option value="">-- BU 선택 --</option>
                        <option value="BNCT">BNCT</option>
                        <option value="LCIT">LCIT</option>
                        <option value="SBCP">SBCP</option>
                    </select>
                </div>

                <div class="lg:col-span-2 flex flex-col sm:flex-row gap-4">
                    <div class="w-full sm:w-1/3 mt-10">
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">필터 적용 기준 필드</label>
                        <select id="filterFieldSelect" onchange="updateFilterCheckboxes()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">-- 데이터 로드 필요 --</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-2/3 mt-10">
                        <label class="flex justify-between items-center text-xs font-semibold text-slate-600 mb-1.5">
                            <span>다중 항목 선택 (체크박스)</span>
                            <div class="flex gap-2">
                                <button onclick="toggleAllFilters(true)" class="text-[10px] text-blue-600 hover:underline">전체선택</button>
                                <button onclick="toggleAllFilters(false)" class="text-[10px] text-red-600 hover:underline">선택해제</button>
                            </div>
                        </label>
                        <div id="filterCheckboxContainer" class="border border-slate-300 rounded-lg bg-slate-50 p-2.5 h-24 overflow-y-auto custom-scrollbar flex flex-wrap gap-2 content-start">
                            <span class="text-xs text-slate-400 p-1">BU를 선택하면 필터 항목이 표시됩니다.</span>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-base font-bold text-slate-700 mb-4 flex items-center gap-2">⚙️ 2. 피벗 테이블 축 구성</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">가로축 (행 필드)</label>
                        <select id="rowFieldSelect" onchange="resetPivotSortAndGenerate()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">-- 선택 --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">세로축 (열 필드)</label>
                        <select id="colFieldSelect" onchange="resetPivotSortAndGenerate()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">-- 선택 (없음 가능) --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">분류할 대상 값 (Value)</label>
                        <select id="valFieldSelect" onchange="resetPivotSortAndGenerate()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">-- 선택 --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">집계 방식</label>
                        <select id="aggTypeSelect" onchange="resetPivotSortAndGenerate()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-semibold text-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="COUNT">갯수 (Count)</option>
                            <option value="SUM">합계 (Sum)</option>
                            <option value="AVERAGE">평균 (Average)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 피벗 테이블 결과 섹션 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
            <div class="p-4 bg-slate-100 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-800 text-sm">📊 조회결과 <span class="text-xs font-normal text-slate-500 ml-2">(값을 클릭하면 상세 데이터 표시, 열 제목을 누르면 정렬됩니다)</span></span>
                    <span id="pivotSummaryBadge" class="text-xs px-2.5 py-1 bg-blue-100 text-blue-700 rounded-full font-medium hidden"></span>
                </div>
                <button onclick="downloadPivotAsCSV()" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-3 py-1.5 rounded-lg shadow-sm">
                    피벗 CSV 다운로드
                </button>
            </div>
            <div class="overflow-x-auto max-h-[400px] overflow-y-auto custom-scrollbar">
                <table id="pivotTable" class="w-full text-xs text-left border-collapse">
                    <thead id="pivotHead" class="bg-slate-50 text-slate-700 font-semibold sticky top-0 z-10 border-b border-slate-300 shadow-sm">
                        <tr>
                            <th class="p-4 text-center text-slate-400 font-normal">BU를 선택하면 GitHub에서 자동으로 피벗 테이블이 생성됩니다.</th>
                        </tr>
                    </thead>
                    <tbody id="pivotBody" class="divide-y divide-slate-100 font-mono">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 상세 데이터 뷰 섹션 -->
        <div id="detailsSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
            
            <div class="p-4 bg-indigo-50 border-b border-indigo-100 flex flex-wrap justify-between items-center">
                <span id="detailsTitle" class="font-bold text-indigo-900 text-sm">🔍 상세 데이터 확인</span>
                <button onclick="document.getElementById('detailsSection').classList.add('hidden')" class="text-xs text-slate-500 hover:text-slate-800">닫기 ✖</button>
            </div>
            
            <!-- 상세 데이터 필드 선택 메뉴 -->
            <div class="p-3 bg-white border-b border-slate-200 flex flex-col gap-2">
                <label class="flex justify-between items-center text-xs font-bold text-green-700">
                    <span>✅ 테이블 표시 필드 다중 선택</span>
                    <div class="flex gap-2">
                        <button onclick="toggleAllDetailFields(true)" class="text-[10px] text-blue-600 hover:underline">전체선택</button>
                        <button onclick="toggleAllDetailFields(false)" class="text-[10px] text-red-600 hover:underline">선택해제</button>
                    </div>
                </label>
                <div id="detailFieldCheckboxContainer" class="flex flex-wrap gap-2 content-start">
                    <!-- 체크박스 동적 생성 -->
                </div>
            </div>

            <!-- 스크롤 없이 전체 표시 -->
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left border-collapse whitespace-nowrap">
                    <thead id="detailsHead" class="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200 shadow-sm">
                    </thead>
                    <tbody id="detailsBody" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>

    <!-- 스크립트 영역 -->
    <script>
        // GitHub Repository 정보
        const GITHUB_OWNER = "42korean";
        const GITHUB_REPO = "seafailures";

        let currentDataRows = []; // 원본 파싱 데이터 보관
        let currentFields = [];
        let selectedDetailFields = [];
        let filteredRowsCache = [];
        let matrixDataRows = {}; 
        
        let pivotSortCol = ''; 
        let pivotSortAsc = false; 

        let currentDetailRows = [];
        let currentSortField = '';
        let currentSortAsc = true;

        // UI 상태 업데이트 함수
        function setSyncStatus(status, isError=false, isSuccess=false) {
            const badge = document.getElementById('syncStatus');
            badge.innerHTML = status;
            if (isError) {
                badge.className = "text-xs bg-rose-50 text-rose-700 border border-rose-200 px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-sm";
            } else if (isSuccess) {
                badge.className = "text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-sm";
            } else {
                badge.className = "text-xs bg-blue-50 text-blue-700 border border-blue-200 px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-sm animate-pulse";
            }
        }

        // BU 선택 시 GitHub API를 통해 최신 CSV 조회 및 로드
        async function loadCSVByBU() {
            const bu = document.getElementById('buSelect').value;
            if (!bu) return;

            setSyncStatus(`🔄 GitHub에서 ${bu} 파일 검색 중...`);
            
            try {
                // 1. GitHub API로 저장소 파일 목록 가져오기
                const apiURL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`;
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error("GitHub 저장소 접근 실패");
                
                const files = await response.json();
                
                // 2. CSV 파일이면서 선택한 BU로 시작하는 파일 찾기
                const targetFiles = files.filter(f => f.name.startsWith(bu) && f.name.toLowerCase().endsWith('.csv'));
                
                if (targetFiles.length === 0) {
                    setSyncStatus(`❌ ${bu} 관련 CSV 파일을 찾지 못했습니다.`, true);
                    return;
                }
                
                // 이름 역순 정렬로 가장 최신 파일(날짜가 가장 뒤인 것) 선택
                targetFiles.sort((a, b) => b.name.localeCompare(a.name));
                const latestFile = targetFiles[0];
                
                setSyncStatus(`📥 [${latestFile.name}] 다운로드 중...`);

                // 3. Raw 데이터 로드
                const rawResponse = await fetch(latestFile.download_url);
                if (!rawResponse.ok) throw new Error("파일 다운로드 실패");
                
                const csvText = await rawResponse.text();
                
                // 4. CSV 파싱 및 메모리 적재
                parseCSVToData(csvText);
                
                setSyncStatus(`✅ [${latestFile.name}] 동기화 완료! (${currentDataRows.length}건)`, false, true);
                
                // 피벗 기본 설정 및 구동
                initializePivotConfig();

            } catch (error) {
                console.error(error);
                setSyncStatus(`❌ 오류 발생: ${error.message}`, true);
            }
        }

        // 간단하고 강력한 CSV 파서 (BOM, 쉼표, 텍스트 포맷 처리)
        function parseCSVToData(csvText) {
            // BOM 제거 및 빈 줄 제거
            const lines = csvText.replace(/^\uFEFF/, '').split(/\r?\n/).filter(line => line.trim().length > 0);
            if (lines.length < 2) return;

            // 1. 헤더 추출
            const headers = parseCSVLine(lines[0]).map(h => h.trim());
            currentFields = headers;

            // 2. 데이터 추출
            currentDataRows = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                const rowObj = {};
                
                headers.forEach((header, idx) => {
                    let val = cols[idx] !== undefined ? cols[idx].trim() : '';
                    // 숫자로만 이루어져 있다면 형변환 시도
                    if (val !== '' && !isNaN(val)) {
                        rowObj[header] = parseFloat(val);
                    } else {
                        rowObj[header] = val;
                    }
                });
                currentDataRows.push(rowObj);
            }
            
            selectedDetailFields = [...currentFields];
        }

        function parseCSVLine(line) {
            const result = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        cur += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur);
            return result;
        }

        // CSV 로드 후 피벗 옵션 초기 셋팅
        function initializePivotConfig() {
            populateFieldDropdowns(currentFields);
            
            // 스마트 기본값 매핑
            const rowCandidate = currentFields.find(f => f.toLowerCase().includes('equip') || f.includes('장비')) || currentFields[1];
            const colCandidate = currentFields.find(f => f.toLowerCase().includes('week') || f.includes('주차') || f.includes('wk')) || currentFields[2] || '';
            const valCandidate = currentFields.find(f => f.toLowerCase().includes('downtime') || f.includes('분')) || currentFields[0];
            const filterCandidate = currentFields.includes('Week') ? 'Week' : currentFields[0];

            setSelectValue('filterFieldSelect', filterCandidate);
            setSelectValue('rowFieldSelect', rowCandidate);
            setSelectValue('colFieldSelect', colCandidate);
            setSelectValue('valFieldSelect', valCandidate);
            setSelectValue('aggTypeSelect', currentFields.find(f => f.toLowerCase().includes('downtime')) ? 'SUM' : 'COUNT');

            updateFilterCheckboxes();
        }

        function populateFieldDropdowns(fields) {
            const filterSel = document.getElementById('filterFieldSelect');
            const rowSel = document.getElementById('rowFieldSelect');
            const colSel = document.getElementById('colFieldSelect');
            const valSel = document.getElementById('valFieldSelect');

            filterSel.innerHTML = '<option value="">-- 필드 선택 --</option>';
            rowSel.innerHTML = '<option value="">-- 선택 --</option>';
            colSel.innerHTML = '<option value="">-- (세로축 없음) --</option>';
            valSel.innerHTML = '<option value="">-- 선택 --</option>';

            fields.forEach(f => {
                filterSel.appendChild(new Option(f, f));
                rowSel.appendChild(new Option(f, f));
                colSel.appendChild(new Option(f, f));
                valSel.appendChild(new Option(f, f));
            });
        }

        function setSelectValue(id, val) {
            const el = document.getElementById(id);
            if ([...el.options].some(o => o.value === val)) el.value = val;
        }

        // 다중 체크박스 필터 로직
        function updateFilterCheckboxes() {
            const filterField = document.getElementById('filterFieldSelect').value;
            const container = document.getElementById('filterCheckboxContainer');
            
            if (!filterField || currentDataRows.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-400 p-1">필드를 선택하세요.</span>';
                resetPivotSortAndGenerate();
                return;
            }

            const uniqueValues = new Set();
            currentDataRows.forEach(row => uniqueValues.add(String(row[filterField] !== undefined && row[filterField] !== '' ? row[filterField] : '(빈값)')));

            const sortedValues = [...uniqueValues].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            container.innerHTML = '';
            sortedValues.forEach(val => {
                const safeVal = val.replace(/"/g, '&quot;');
                const label = document.createElement('label');
                label.className = "inline-flex items-center gap-1.5 bg-white border border-slate-200 px-2.5 py-1 rounded-md cursor-pointer hover:bg-blue-50 transition-colors";
                label.innerHTML = `<input type="checkbox" value="${safeVal}" checked onchange="applyFiltersAndGeneratePivot()" class="w-3 h-3 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                    <span class="text-[11px] font-medium text-slate-700 select-none">${val}</span>`;
                container.appendChild(label);
            });
            resetPivotSortAndGenerate();
        }

        function toggleAllFilters(check) {
            const container = document.getElementById('filterCheckboxContainer');
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = check);
            applyFiltersAndGeneratePivot();
        }

        function applyFiltersAndGeneratePivot() {
            const filterField = document.getElementById('filterFieldSelect').value;
            
            let targetData = currentDataRows;
            if (filterField) {
                const container = document.getElementById('filterCheckboxContainer');
                const checkedBoxes = Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
                targetData = currentDataRows.filter(row => {
                    const val = String(row[filterField] !== undefined && row[filterField] !== '' ? row[filterField] : '(빈값)');
                    return checkedBoxes.includes(val);
                });
            }
            filteredRowsCache = targetData;
            
            generatePivotTable();
            document.getElementById('detailsSection').classList.add('hidden');
        }

        function resetPivotSortAndGenerate() {
            pivotSortCol = '';
            pivotSortAsc = false;
            applyFiltersAndGeneratePivot();
        }

        function sortPivotTable(colKey) {
            if (pivotSortCol === colKey) pivotSortAsc = !pivotSortAsc; 
            else { pivotSortCol = colKey; pivotSortAsc = false; }
            generatePivotTable();
        }

        // 피벗 테이블 렌더링 엔진
        function generatePivotTable() {
            const rowField = document.getElementById('rowFieldSelect').value;
            const colField = document.getElementById('colFieldSelect').value;
            const valField = document.getElementById('valFieldSelect').value;
            const aggType = document.getElementById('aggTypeSelect').value;

            const tableHead = document.getElementById('pivotHead');
            const tableBody = document.getElementById('pivotBody');
            const badge = document.getElementById('pivotSummaryBadge');

            if (!rowField || !valField) {
                tableHead.innerHTML = `<tr><th class="p-4 text-center text-slate-400 font-normal">가로축 및 값 필드를 선택해주세요.</th></tr>`;
                tableBody.innerHTML = '';
                badge.classList.add('hidden');
                return;
            }
            if (filteredRowsCache.length === 0) {
                tableHead.innerHTML = `<tr><th class="p-4 text-center text-slate-400 font-normal">조건에 맞는 데이터가 없습니다.</th></tr>`;
                tableBody.innerHTML = '';
                badge.classList.add('hidden');
                return;
            }

            const rowKeysSet = new Set();
            const colKeysSet = new Set();
            matrixDataRows = {};

            filteredRowsCache.forEach(row => {
                rowKeysSet.add(String(row[rowField] !== undefined && row[rowField] !== '' ? row[rowField] : '(빈값)'));
                if (colField) colKeysSet.add(String(row[colField] !== undefined && row[colField] !== '' ? row[colField] : '(빈값)'));
            });

            let rowKeys = [...rowKeysSet].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            const colKeys = colField ? [...colKeysSet].sort((a, b) => a.localeCompare(b, undefined, { numeric: true })) : ['값'];

            const matrix = {};
            const rowTotalCache = {}; 

            rowKeys.forEach(r => {
                matrix[r] = {}; rowTotalCache[r] = []; matrixDataRows[r] = {}; matrixDataRows[r]['__ROW_TOTAL__'] = []; 
                colKeys.forEach(c => { matrix[r][c] = []; matrixDataRows[r][c] = []; });
            });
            matrixDataRows['__COL_TOTAL__'] = {};
            colKeys.forEach(c => { matrixDataRows['__COL_TOTAL__'][c] = []; });
            matrixDataRows['__GRAND_TOTAL__'] = [];

            filteredRowsCache.forEach(row => {
                const rVal = String(row[rowField] !== undefined && row[rowField] !== '' ? row[rowField] : '(빈값)');
                const cVal = colField ? String(row[colField] !== undefined && row[colField] !== '' ? row[colField] : '(빈값)') : '값';
                let rawNum = parseFloat(row[valField]);
                let numVal = !isNaN(rawNum) ? rawNum : 1;
                
                if (matrix[rVal] && matrix[rVal][cVal]) {
                    matrix[rVal][cVal].push(numVal);
                    rowTotalCache[rVal].push(numVal);
                    matrixDataRows[rVal][cVal].push(row);
                    matrixDataRows[rVal]['__ROW_TOTAL__'].push(row);
                    matrixDataRows['__COL_TOTAL__'][cVal].push(row);
                    matrixDataRows['__GRAND_TOTAL__'].push(row);
                }
            });

            function calcAggregate(arr) {
                if (!arr || arr.length === 0) return 0;
                if (aggType === 'COUNT') return arr.length;
                if (aggType === 'SUM') return arr.reduce((acc, v) => acc + v, 0);
                if (aggType === 'AVERAGE') return arr.reduce((acc, v) => acc + v, 0) / arr.length;
                return 0;
            }

            if (pivotSortCol) {
                rowKeys.sort((a, b) => {
                    let valA = 0, valB = 0;
                    if (pivotSortCol === '__ROW_TOTAL__') { valA = calcAggregate(rowTotalCache[a]); valB = calcAggregate(rowTotalCache[b]); } 
                    else if (matrix[a][pivotSortCol] && matrix[b][pivotSortCol]) { valA = calcAggregate(matrix[a][pivotSortCol]); valB = calcAggregate(matrix[b][pivotSortCol]); }
                    return pivotSortAsc ? valA - valB : valB - valA;
                });
            }

            let headHTML = `<tr><th class="p-3 bg-slate-200 border border-slate-300 text-slate-800 font-bold sticky left-0 z-20 min-w-[140px]">${rowField} \\ ${colField || '집계'}</th>`;
            colKeys.forEach(c => {
                const sortIcon = pivotSortCol === c ? (pivotSortAsc ? '▲' : '▼') : '';
                headHTML += `<th onclick="sortPivotTable('${c.replace(/'/g, "\\'")}')" class="p-3 border border-slate-300 text-center font-bold text-slate-700 bg-slate-100 min-w-[90px] sortable-header hover:bg-slate-200" title="클릭하여 정렬">${c} <span class="text-blue-500 text-[10px] ml-0.5">${sortIcon}</span></th>`;
            });
            const rowTotalIcon = pivotSortCol === '__ROW_TOTAL__' ? (pivotSortAsc ? '▲' : '▼') : '';
            headHTML += `<th onclick="sortPivotTable('__ROW_TOTAL__')" class="p-3 border border-slate-300 text-center font-bold text-blue-900 bg-blue-100 min-w-[100px] sortable-header hover:bg-blue-200">행 합계 <span class="text-blue-600 text-[10px] ml-0.5">${rowTotalIcon}</span></th></tr>`;
            tableHead.innerHTML = headHTML;

            const colTotals = {};
            colKeys.forEach(c => { colTotals[c] = []; });
            let grandTotalList = [];
            let bodyHTML = '';

            bodyHTML += `<tr class="bg-blue-50 font-bold border-b-2 border-slate-400 shadow-sm">
                <td class="p-3 text-slate-900 sticky left-0 bg-blue-50 border border-slate-300 text-center">총합계</td>`;
            
            colKeys.forEach(c => {
                rowKeys.forEach(r => {
                    const arr = matrix[r][c];
                    colTotals[c].push(...arr);
                    grandTotalList.push(...arr);
                });
                const colAgg = calcAggregate(colTotals[c]);
                const displayColAgg = colAgg === 0 ? '-' : (aggType === 'AVERAGE' ? colAgg.toFixed(1) : colAgg.toLocaleString());
                bodyHTML += `<td onclick="showDetails('__COL_TOTAL__', '${c.replace(/'/g, "\\'")}')" class="p-3 text-right text-blue-900 border border-slate-300 pivot-cell">${displayColAgg}</td>`;
            });
            const grandTotalAgg = calcAggregate(grandTotalList);
            const displayGrandTotal = grandTotalAgg === 0 ? '-' : (aggType === 'AVERAGE' ? grandTotalAgg.toFixed(1) : grandTotalAgg.toLocaleString());
            bodyHTML += `<td onclick="showDetails('__GRAND_TOTAL__', null)" class="p-3 text-right text-blue-950 bg-blue-200 border border-slate-300 pivot-cell">${displayGrandTotal}</td></tr>`;

            rowKeys.forEach(r => {
                const safeR = r.replace(/'/g, "\\'");
                bodyHTML += `<tr class="hover:bg-blue-50/50 transition-colors"><td class="p-2.5 font-semibold text-slate-800 bg-white border border-slate-200 sticky left-0 z-10">${r}</td>`;
                colKeys.forEach(c => {
                    const safeC = c.replace(/'/g, "\\'");
                    const arr = matrix[r][c];
                    const val = calcAggregate(arr);
                    const displayVal = val === 0 ? '-' : (aggType === 'AVERAGE' ? val.toFixed(1) : val.toLocaleString());
                    bodyHTML += `<td onclick="showDetails('${safeR}', '${safeC}')" class="p-2.5 text-right border border-slate-200 text-slate-700 pivot-cell" title="클릭하여 상세 데이터 보기">${displayVal}</td>`;
                });
                const rowAgg = calcAggregate(rowTotalCache[r]);
                const displayRowAgg = rowAgg === 0 ? '-' : (aggType === 'AVERAGE' ? rowAgg.toFixed(1) : rowAgg.toLocaleString());
                bodyHTML += `<td onclick="showDetails('${safeR}', '__ROW_TOTAL__')" class="p-2.5 text-right font-bold text-blue-900 bg-slate-100 border border-slate-200 pivot-cell" title="행 전체 상세 데이터 보기">${displayRowAgg}</td></tr>`;
            });

            tableBody.innerHTML = bodyHTML;
            badge.innerText = `집계 대상: [${valField}] ${aggType === 'COUNT' ? '갯수' : aggType === 'SUM' ? '합계' : '평균'}`;
            badge.classList.remove('hidden');
        }

        // 상세 데이터 보기
        function showDetails(rowKey, colKey) {
            let targetData = [];
            let desc = '';
            if (rowKey === '__GRAND_TOTAL__') { targetData = matrixDataRows['__GRAND_TOTAL__']; desc = '총합계 (전체)'; } 
            else if (rowKey === '__COL_TOTAL__') { targetData = matrixDataRows['__COL_TOTAL__'][colKey]; desc = `[열 합계] ${colKey}`; } 
            else if (colKey === '__ROW_TOTAL__') { targetData = matrixDataRows[rowKey]['__ROW_TOTAL__']; desc = `[행 합계] ${rowKey}`; } 
            else { targetData = matrixDataRows[rowKey][colKey]; desc = `[${rowKey} / ${colKey}]`; }

            if (!targetData || targetData.length === 0) return alert('해당 항목의 상세 데이터가 없습니다.');

            currentDetailRows = [...targetData];
            document.getElementById('detailsTitle').innerText = `🔍 상세 데이터: ${desc} (총 ${currentDetailRows.length}건)`;
            
            renderDetailFieldCheckboxes();
            
            currentSortField = selectedDetailFields.length > 0 ? selectedDetailFields[0] : '';
            currentSortAsc = true;
            
            document.getElementById('detailsSection').classList.remove('hidden');
            renderDetailsTable();
            document.getElementById('detailsSection').scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function renderDetailFieldCheckboxes() {
            const container = document.getElementById('detailFieldCheckboxContainer');
            container.innerHTML = '';
            currentFields.forEach(field => {
                const isChecked = selectedDetailFields.includes(field) ? 'checked' : '';
                const safeFieldVal = field.replace(/"/g, '&quot;');
                const label = document.createElement('label');
                label.className = "inline-flex items-center gap-1.5 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-md cursor-pointer hover:bg-blue-100 transition-colors";
                label.innerHTML = `
                    <input type="checkbox" value="${safeFieldVal}" ${isChecked} onchange="updateSelectedDetailFields()" class="w-3 h-3 text-blue-600 rounded border-blue-300 focus:ring-blue-500">
                    <span class="text-[11px] font-medium text-blue-800 select-none">${field}</span>
                `;
                container.appendChild(label);
            });
        }

        function toggleAllDetailFields(check) {
            const container = document.getElementById('detailFieldCheckboxContainer');
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = check);
            updateSelectedDetailFields();
        }

        function updateSelectedDetailFields() {
            const container = document.getElementById('detailFieldCheckboxContainer');
            const checkedBoxes = Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            selectedDetailFields = checkedBoxes;
            renderDetailsTable();
        }

        function renderDetailsTable() {
            const thead = document.getElementById('detailsHead');
            const tbody = document.getElementById('detailsBody');
            
            let headHTML = '<tr>';
            selectedDetailFields.forEach(field => {
                const sortIcon = currentSortField === field ? (currentSortAsc ? '▲' : '▼') : '↕';
                const textColor = currentSortField === field ? 'text-blue-600' : 'text-slate-400';
                const safeFieldArg = field.replace(/'/g, "\\'");
                headHTML += `
                    <th onclick="sortDetails('${safeFieldArg}')" class="p-3 detail-sortable whitespace-nowrap min-w-[80px]">
                        ${field} <span class="${textColor} text-[10px] ml-1">${sortIcon}</span>
                    </th>
                `;
            });
            headHTML += '</tr>';
            thead.innerHTML = headHTML;

            tbody.innerHTML = currentDetailRows.map(row => {
                let rowHTML = '<tr class="hover:bg-slate-50 transition-colors">';
                selectedDetailFields.forEach(field => {
                    const val = row[field] !== undefined && row[field] !== null ? row[field] : '';
                    rowHTML += `<td class="p-2.5 border-b border-slate-100 text-slate-700 whitespace-nowrap">${val}</td>`;
                });
                rowHTML += '</tr>';
                return rowHTML;
            }).join('');
        }

        function sortDetails(field) {
            if (currentSortField === field) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortField = field;
                currentSortAsc = true;
            }

            currentDetailRows.sort((a, b) => {
                let valA = a[field] !== undefined && a[field] !== null ? a[field] : '';
                let valB = b[field] !== undefined && b[field] !== null ? b[field] : '';

                const isDateStrA = typeof valA === 'string' && /^\d{4}-\d{2}-\d{2}/.test(valA);
                const isDateStrB = typeof valB === 'string' && /^\d{4}-\d{2}-\d{2}/.test(valB);

                if (isDateStrA || isDateStrB) {
                    const timeA = new Date(valA).getTime() || 0;
                    const timeB = new Date(valB).getTime() || 0;
                    return currentSortAsc ? timeA - timeB : timeB - timeA;
                }

                valA = String(valA);
                valB = String(valB);
                return currentSortAsc 
                    ? valA.localeCompare(valB, undefined, { numeric: true }) 
                    : valB.localeCompare(valA, undefined, { numeric: true });
            });
            renderDetailsTable();
        }

        function downloadPivotAsCSV() {
            const table = document.getElementById('pivotTable');
            if (!table || table.rows.length <= 1) return alert('내보낼 피벗 테이블 데이터가 없습니다.');
            let csvContent = '\uFEFF';
            for (let r of table.rows) {
                let rowData = [];
                for (let c of r.cells) {
                    let text = c.innerText.replace(/"/g, '""');
                    rowData.push(`"${text}"`);
                }
                csvContent += rowData.join(',') + '\r\n';
            }
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', `크레인_피벗결과_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
